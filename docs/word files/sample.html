<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Quiz System - Background Persistent Timer</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    
    <style>
        /* تعريف المتغيرات للوضع الداكن الافتراضي (Royal Blue Theme) */
        :root {
            --bg-color: #060a12; 
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.07);
            
            --neon-accent: #4169e1;     
            --neon-glow: rgba(65, 105, 225, 0.45);
            
            --neon-correct: #10b981;
            --neon-correct-glow: rgba(16, 185, 129, 0.4);

            --neon-date: #5c85ff;       
            --neon-date-glow: rgba(65, 105, 225, 0.3);

            --neon-selected: #f3b700;   
            --neon-selected-glow: rgba(243, 183, 0, 0.4);

            --neon-wrong: #ff3366;      
            
            --letter-badge-color: #5c85ff;
            --letter-bg-color: rgba(65, 105, 225, 0.1);
            
            --timer-green: #10b981; 
            --timer-orange: #ff9900;
            --timer-red: #ff3366;
            --current-timer-color: var(--timer-green);
            
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --card-title-color: #ffffff;
            --option-bg: rgba(0, 0, 0, 0.25);
            --option-hover: rgba(255, 255, 255, 0.04);
            --smooth-physics: cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* تعديل المتغيرات عند تفعيل الـ Light Mode */
        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --glass-bg: #ffffff;
            --glass-border: #cbd5e1;
            
            --neon-accent: #1e40af; 
            --neon-glow: rgba(30, 64, 175, 0.15);
            
            --neon-correct: #059669;
            --neon-correct-glow: rgba(5, 150, 105, 0.15);

            --neon-date: #1e40af;       
            --neon-date-glow: transparent;

            --neon-selected: #d97706;   
            --neon-selected-glow: rgba(217, 119, 6, 0.1);

            --neon-wrong: #ef4444;      
            
            --letter-badge-color: #1e40af;
            --letter-bg-color: rgba(30, 64, 175, 0.08);
            
            --timer-green: #059669;
            --timer-orange: #d97706;
            --timer-red: #ef4444;
            
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-title-color: #0f172a;
            --option-bg: #f8fafc;
            --option-hover: #e2e8f0;
        }

        /* تعديلات مخصصة للألوان داخل الـ Light Mode */
        [data-theme="light"] .option-btn.correct {
            background: #f0fdf4 !important; 
            border-color: var(--neon-correct) !important;
            color: var(--neon-correct) !important;
            text-shadow: none !important;
        }

        [data-theme="light"] .option-btn.wrong {
            background: #fef2f2 !important; 
            border-color: var(--neon-wrong) !important;
            color: var(--neon-wrong) !important;
            text-shadow: none !important;
        }

        [data-theme="light"] .q-number, 
        [data-theme="light"] .highlight-badge {
            text-shadow: none !important; 
        }

        [data-theme="light"] .score-board {
            background: #eff6ff;
            border-color: #1e40af;
            box-shadow: 0 10px 30px rgba(30, 64, 175, 0.1);
        }

        [data-theme="light"] .score-number {
            text-shadow: none;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 400; 
            text-decoration: none;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* حاوية التايمر العائم العلوي */
        .timer-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 15px 25px;
            border-radius: 20px;
            z-index: 999;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 400px;
            gap: 8px;
        }

        .timer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            font-weight: bold;
            color: var(--card-title-color);
        }

        #timer-display {
            color: var(--current-timer-color);
            font-size: 1.1rem;
            font-variant-numeric: tabular-nums;
            transition: color 0.4s var(--smooth-physics);
        }

        /* ستايل البروجريس بار الرئيسي */
        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.05);
            block-size: 8px;
            inline-size: 100%;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        
        [data-theme="light"] .progress-bar-bg {
            background: rgba(0, 0, 0, 0.05);
        }

        .progress-bar-fill {
            background-color: var(--current-timer-color);
            block-size: 100%;
            inline-size: 100%; 
            border-radius: 4px;
            transition: inline-size 1s linear, background-color 0.4s var(--smooth-physics);
        }

        .timer-container.pulse-danger {
            animation: dangerPulse 1s infinite alternate var(--smooth-physics);
            border-color: rgba(255, 51, 102, 0.3);
        }

        @keyframes dangerPulse {
            from { transform: translateX(-50%) scale(1); }
            to { transform: translateX(-50%) scale(1.02); }
        }

        /* ستايل زر تبديل الثيم */
        .theme-switch-wrapper {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
        }

        .theme-switch {
            inline-size: 60px;
            block-size: 30px;
            position: relative;
            display: inline-block;
        }

        .theme-switch input { 
            opacity: 0;
            inline-size: 0;
            block-size: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1e293b;
            transition: 0.4s var(--smooth-physics);
            border-radius: 34px;
            border: 1px solid var(--glass-border);
        }

        .slider:before {
            position: absolute;
            content: "🌙";
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            block-size: 24px;
            inline-size: 24px;
            left: 3px;
            bottom: 2px;
            background-color: #060a12;
            transition: 0.4s var(--smooth-physics);
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #cbd5e1;
        }

        input:checked + .slider:before {
            transform: translateX(28px);
            content: "☀️";
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* المكونات الهيكلية للواجهة */
        .upload-section {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .upload-section h2 { 
            font-size: 1.5rem; 
            color: var(--card-title-color); 
        }

        .timer-input-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 280px;
        }

        .timer-input-wrapper label {
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .custom-timer-input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--neon-accent);
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .custom-timer-input:focus {
            border-color: var(--neon-accent);
            box-shadow: 0 0 10px var(--neon-glow);
        }

        [data-theme="light"] .custom-timer-input {
            background: #f1f5f9;
        }

        input[type="file"] { display: none; }

        .btn-style {
            display: inline-block;
            padding: 12px 30px;
            cursor: pointer;
            background: transparent;
            color: var(--neon-accent);
            border: 1px solid var(--neon-accent);
            border-radius: 8px;
            font-size: 1.1rem;
            transition: all 0.4s var(--smooth-physics);
        }

        .btn-style:hover {
            background: var(--neon-accent);
            color: #ffffff;
            box-shadow: 0 0 15px var(--neon-glow);
            font-weight: bold;
        }

        #questions-container, #results-page {
            width: 100%;
            max-width: 100%;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-bottom: 40px;
            margin-top: 60px; 
        }

        #mistakes-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
        }

        .question-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 25px;
            border-radius: 16px;
            text-align: left;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .question-card:hover {
            transform: translateY(-2px);
        }

        .question-card.missed {
            border-color: var(--neon-wrong);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.15);
        }

        .q-text {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--card-title-color);
            line-height: 1.6;
            text-align: left;
            width: 100%;
        }

        .q-number {
            color: var(--neon-accent);
            font-weight: bold;
            margin-right: 8px;
            text-shadow: 0 0 8px var(--neon-glow);
        }

        .highlight-badge {
            background: rgba(65, 105, 225, 0.08);
            color: var(--neon-accent);
            border: 1px solid var(--neon-accent);
            padding: 2px 10px;          
            border-radius: 20px;         
            font-size: 0.82rem;          
            font-weight: 600;
            margin: 0 6px 0 0;
            box-shadow: 0 0 8px var(--neon-glow);
            display: inline-block;
            vertical-align: middle;
        }

        .date-badge {
            background: rgba(65, 105, 225, 0.05) !important;
            color: var(--neon-date) !important;
            border: 1px solid var(--neon-date) !important;
            box-shadow: 0 0 8px var(--neon-date-glow) !important;
            align-self: flex-end;
            margin-top: 25px;
            margin-bottom: 15px;
            padding: 2px 12px;           
            border-radius: 20px;         
            font-size: 0.82rem;
            text-shadow: none !important;
        }

        [data-theme="light"] .date-badge {
            background: rgba(30, 64, 175, 0.05) !important;
            box-shadow: none !important;
        }

        /* تصميم شبكة الأجوبة المتجاوب */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 15px;
            width: 100%;
        }

        .option-btn {
            display: flex;
            justify-content: flex-start; 
            align-items: center;
            background: var(--option-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            gap: 12px; 
        }

        .option-letter {
            color: var(--letter-badge-color);
            background: var(--letter-bg-color);
            border: 1px solid rgba(65, 105, 225, 0.2);
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.95rem;
            display: inline-block;
            transition: all 0.3s var(--smooth-physics);
        }

        [data-theme="light"] .option-letter {
            border-color: rgba(30, 64, 175, 0.2);
        }

        .option-btn.selected .option-letter {
            color: var(--neon-selected);
            background: rgba(243, 183, 0, 0.15);
            border-color: var(--neon-selected);
        }

        .option-btn.correct .option-letter {
            color: #ffffff !important;
            background: var(--neon-correct) !important;
            border-color: var(--neon-correct) !important;
        }

        .option-btn.wrong .option-letter {
            color: #ffffff !important;
            background: #dc2626 !important;
            border-color: #f87171 !important;
        }

        .option-text-content {
            flex-grow: 1;
            text-align: left;
        }

        .option-btn:hover:not(.locked) {
            border-color: rgba(128, 128, 128, 0.4);
            background: var(--option-hover);
        }

        .option-btn.selected {
            background: rgba(217, 119, 6, 0.08);
            border-color: var(--neon-selected);
            color: var(--neon-selected);
            box-shadow: inset 0 0 10px var(--neon-selected-glow);
        }

        .option-btn.correct {
            background: rgba(16, 185, 129, 0.1) !important;
            border-color: var(--neon-correct) !important;
            color: #52e0b5 !important;
            text-shadow: 0 0 8px var(--neon-correct-glow);
            font-weight: bold;
        }

        .option-btn.wrong {
            background: rgba(255, 51, 102, 0.08) !important;
            border-color: var(--neon-wrong) !important;
            color: var(--neon-wrong) !important;
            font-weight: bold;
        }

        .feedback-icon {
            font-size: 1.2rem;
            margin-left: auto; 
            font-weight: bold;
        }

        #submit-section {
            text-align: center;
            width: 100%;
            padding-bottom: 50px;
        }

        .hidden { display: none !important; }

        .score-board {
            background: rgba(65, 105, 225, 0.03);
            border: 1px solid var(--neon-accent);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px var(--neon-glow);
            width: 100%;
        }

        .score-board h1 {
            font-size: 2.5rem;
            color: var(--card-title-color);
            margin-bottom: 15px;
        }

        .score-number {
            font-size: 4rem;
            color: var(--neon-accent);
            font-weight: bold;
            text-shadow: 0 0 20px var(--neon-glow);
        }

        .mistakes-title {
            font-size: 1.8rem;
            color: var(--neon-wrong);
            text-align: center;
            margin-bottom: 20px;
        }

        .mistake-card {
            border-left: 5px solid var(--neon-wrong);
            margin-bottom: 25px;
        }

        @media (max-width: 1024px) {
            .options-grid { 
                grid-template-columns: 1fr 1fr; 
            }
        }

        @media (max-width: 600px) {
            .options-grid { 
                grid-template-columns: 1fr; 
            }
            #questions-container, #results-page { padding: 0 10px; margin-top: 40px; }
            .date-badge { align-self: flex-start; margin-top: 15px; }
        }
    </style>
</head>
<body>

    <div id="timer-bar" class="timer-container hidden">
        <div class="timer-header">
            <span>⏱️ Time Remaining</span>
            <span id="timer-display">30:00</span>
        </div>
        <div class="progress-bar-bg">
            <div id="timer-progress-fill" class="progress-bar-fill"></div>
        </div>
    </div>

    <div class="theme-switch-wrapper">
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" />
            <div class="slider"></div>
        </label>
    </div>

    <div class="upload-section" id="upload-section">
        <h2>Upload Questions Word File</h2>
        
        <div class="timer-input-wrapper">
            <label for="quiz-duration-input">Set Quiz Duration (Minutes):</label>
            <input type="number" id="quiz-duration-input" class="custom-timer-input" value="30" min="1" max="180">
        </div>

        <label class="btn-style custom-file-upload">
            <input type="file" id="word-file" accept=".docx">
            Choose .docx File
        </label>
        <p id="file-name" style="color: var(--text-muted); font-size: 0.9rem; margin-top: -5px;"></p>
    </div>

    <div id="questions-container"></div>

    <div id="submit-section" class="hidden">
        <button id="submit-btn" class="btn-style" style="background: var(--neon-accent); color: #ffffff;">Submit Answers</button>
    </div>

    <div id="results-page" class="hidden">
        <div class="score-board">
            <h1>Your Final Score</h1>
            <div class="score-number" id="final-score-display">0 / 0</div>
            <p id="score-message" style="margin-top: 15px; font-size: 1.2rem;"></p>
            <br>
            <button class="btn-style" onclick="clearQuizStorage(); location.reload();">Take Another Quiz</button>
        </div>
        
        <h2 id="mistakes-title" class="mistakes-title">Review Your Mistakes</h2>
        <div id="mistakes-container"></div>
    </div>

    <template id="question-template">
        <div class="question-card" data-correct="">
            <div class="q-text"></div>
            <div class="options-grid">
                <button class="option-btn" data-opt="A"></button>
                <button class="option-btn" data-opt="B"></button>
                <button class="option-btn" data-opt="C"></button>
                <button class="option-btn" data-opt="D"></button>
            </div>
        </div>
    </template>

    <script>
        let timerInterval = null;
        let totalInitialSeconds = 1800; 
        let quizEndTime = null; // سيتم حفظ الـ Timestamp المطلق هنا ومزامنته

        const toggleSwitch = document.querySelector('.theme-switch input[type="checkbox"]');
        const currentTheme = localStorage.getItem('theme') ? localStorage.getItem('theme') : null;

        if (currentTheme) {
            document.documentElement.setAttribute('data-theme', currentTheme);
            if (currentTheme === 'light') {
                toggleSwitch.checked = true;
            }
        }

        function switchTheme(e) {
            if (e.target.checked) {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        toggleSwitch.addEventListener('change', switchTheme, false);

        const highlightKeywords = ["R1", "R2", "R3", "R4", "SB", "AB", "WB", "LM", "S.B", "W.B", "PT"];
        
        document.getElementById('word-file').addEventListener('change', handleFile, false);

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('file-name').innerText = "Selected: " + file.name;

            const reader = new FileReader();
            reader.onload = function(event) {
                mammoth.convertToHtml({arrayBuffer: event.target.result})
                    .then(result => parseWordTable(result.value))
                    .catch(err => {
                        console.error("Error:", err);
                        alert("Please upload a valid .docx file containing the questions table.");
                    });
            };
            reader.readAsArrayBuffer(file);
        }

        function extractOptionDetails(cellText, defaultLetter) {
            const optionRegex = /^([A-D])([\.\s\)-]+)(.*)/i;
            const match = cellText.match(optionRegex);
            
            if (match) {
                return {
                    letter: match[1].toUpperCase(),
                    text: match[3].trim()
                };
            }
            return {
                letter: defaultLetter,
                text: cellText
            };
        }

        function parseWordTable(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const rows = doc.querySelectorAll('tr');

            if (rows.length <= 1) return alert("No questions table found in the document!");

            document.getElementById('upload-section').classList.add('hidden');

            const container = document.getElementById('questions-container');
            const template = document.getElementById('question-template');
            
            container.innerHTML = '';
            container.classList.remove('hidden');
            document.getElementById('results-page').classList.add('hidden');
            document.getElementById('submit-section').classList.remove('hidden');
            document.getElementById('submit-btn').style.display = 'inline-block';

            const sortedKeywords = [...highlightKeywords].sort((a, b) => b.length - a.length);
            const keywordPattern = sortedKeywords.map(k => k.replace(/\./g, '\\.')).join('|');
            
            const badgeRegex = new RegExp(`^\\s*([\\(\\[]?)\\s*(${keywordPattern})\\s*([\\)\\]]?)\\s*[:-]?\\s*`, 'i');
            const numberRegex = /^(\s*\d+\s*[\.\-\)]?\s*)/;

            for (let i = 1; i < rows.length; i++) {
                const cells = rows[i].querySelectorAll('td');
                
                if (cells.length >= 6) {
                    let qNum = "";
                    let qTextOriginal = "";
                    let cellA = "", cellB = "", cellC = "", cellD = "", correctAns = "";

                    if (cells.length >= 7) {
                        qNum = (cells[0].innerText || cells[0].textContent).trim().replace(/[\.\-\)]/g, '');
                        qTextOriginal = (cells[1].innerText || cells[1].textContent).trim();
                        cellA = (cells[2].innerText || cells[2].textContent).trim();
                        cellB = (cells[3].innerText || cells[3].textContent).trim();
                        cellC = (cells[4].innerText || cells[4].textContent).trim();
                        cellD = (cells[5].innerText || cells[5].textContent).trim();
                        correctAns = (cells[6].innerText || cells[6].textContent).trim().toUpperCase();
                    } else {
                        qTextOriginal = (cells[0].innerText || cells[0].textContent).trim();
                        cellA = (cells[1].innerText || cells[1].textContent).trim();
                        cellB = (cells[2].innerText || cells[2].textContent).trim();
                        cellC = (cells[3].innerText || cells[3].textContent).trim();
                        cellD = (cells[4].innerText || cells[4].textContent).trim();
                        correctAns = (cells[5].innerText || cells[5].textContent).trim().toUpperCase();

                        let numMatch = qTextOriginal.match(numberRegex);
                        if (numMatch) {
                            qNum = numMatch[0].trim().replace(/[\.\-\)]/g, '');
                            qTextOriginal = qTextOriginal.substring(numMatch[0].length).trim();
                        } else {
                            qNum = i;
                        }
                    }

                    const optA = extractOptionDetails(cellA, 'A');
                    const optB = extractOptionDetails(cellB, 'B');
                    const optC = extractOptionDetails(cellC, 'C');
                    const optD = extractOptionDetails(cellD, 'D');

                    let remainingText = qTextOriginal;
                    let badgesHTML = "";

                    let badgeMatch = remainingText.match(badgeRegex);
                    while (badgeMatch) {
                        let matchedKeyword = badgeMatch[2].toUpperCase();
                        badgesHTML += `<span class="highlight-badge">${matchedKeyword}</span>`;
                        remainingText = remainingText.substring(badgeMatch[0].length).trim();
                        badgeMatch = remainingText.match(badgeRegex);
                    }

                    let dateBadgeHTML = "";
                    let lastDotIndex = remainingText.lastIndexOf('.');
                    if (lastDotIndex !== -1) {
                        let afterDot = remainingText.substring(lastDotIndex + 1).trim();
                        if (/\d{4}/.test(afterDot) && afterDot.length > 0 && afterDot.length < 25) {
                            remainingText = remainingText.substring(0, lastDotIndex + 1);
                            dateBadgeHTML = `<span class="highlight-badge date-badge">${afterDot}</span>`;
                        }
                    }

                    let qNumHTML = qNum ? `<span class="q-number">${qNum}.</span>` : "";
                    let modifiedQuestionHTML = qNumHTML + (badgesHTML ? " " + badgesHTML + " " : " ") + remainingText;

                    const clone = template.content.cloneNode(true);
                    const cardElement = clone.querySelector('.question-card');
                    
                    cardElement.setAttribute('data-correct', correctAns);
                    cardElement.setAttribute('data-opta', optA.text);
                    cardElement.setAttribute('data-optb', optB.text);
                    cardElement.setAttribute('data-optc', optC.text);
                    cardElement.setAttribute('data-optd', optD.text);
                    
                    cardElement.setAttribute('data-lettera', optA.letter);
                    cardElement.setAttribute('data-letterb', optB.letter);
                    cardElement.setAttribute('data-letterc', optC.letter);
                    cardElement.setAttribute('data-letterd', optD.letter);
                    
                    cardElement.querySelector('.q-text').innerHTML = modifiedQuestionHTML;
                    
                    if (dateBadgeHTML) {
                        const parser = new DOMParser();
                        const badgeDoc = parser.parseFromString(dateBadgeHTML, 'text/html');
                        const badgeNode = badgeDoc.body.firstChild;
                        cardElement.insertBefore(badgeNode, cardElement.querySelector('.options-grid'));
                    }

                    const buttons = clone.querySelectorAll('.option-btn');
                    buttons[0].innerHTML = `<span class="option-letter">${optA.letter}</span><span class="option-text-content">${optA.text}</span>`;
                    buttons[1].innerHTML = `<span class="option-letter">${optB.letter}</span><span class="option-text-content">${optB.text}</span>`;
                    buttons[2].innerHTML = `<span class="option-letter">${optC.letter}</span><span class="option-text-content">${optC.text}</span>`;
                    buttons[3].innerHTML = `<span class="option-letter">${optD.letter}</span><span class="option-text-content">${optD.text}</span>`;

                    buttons.forEach(btn => {
                        btn.addEventListener('click', function() {
                            cardElement.classList.remove('missed');
                            buttons.forEach(b => b.classList.remove('selected'));
                            this.classList.add('selected');
                        });
                    });

                    container.appendChild(clone);
                }
            }
            
            const userDurationMinutes = parseInt(document.getElementById('quiz-duration-input').value) || 30;
            totalInitialSeconds = userDurationMinutes * 60;
            
            // حساب وقت النهاية المطلق وحفظه في الـ localStorage لضمان استمراره في الخلفية
            quizEndTime = Date.now() + (totalInitialSeconds * 1000);
            localStorage.setItem('quiz_end_time', quizEndTime);
            localStorage.setItem('quiz_total_initial_seconds', totalInitialSeconds);
            
            startQuizTimer();
        }

        function updateTimerUI(secondsLeft) {
            const timerBar = document.getElementById('timer-bar');
            const timerDisplay = document.getElementById('timer-display');
            const progressFill = document.getElementById('timer-progress-fill');
            
            let percentageLeft = (secondsLeft / totalInitialSeconds) * 100;
            progressFill.style.width = `${percentageLeft}%`;

            if (percentageLeft <= 20) {
                document.documentElement.style.setProperty('--current-timer-color', 'var(--timer-red)');
                timerBar.classList.add('pulse-danger');
            } else if (percentageLeft <= 60) {
                document.documentElement.style.setProperty('--current-timer-color', 'var(--timer-orange)');
                timerBar.classList.remove('pulse-danger');
            } else {
                document.documentElement.style.setProperty('--current-timer-color', 'var(--timer-green)');
                timerBar.classList.remove('pulse-danger');
            }

            let minutes = Math.floor(secondsLeft / 60);
            let seconds = secondsLeft % 60;

            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            timerDisplay.innerText = `${minutes}:${seconds}`;
        }

        function startQuizTimer() {
            clearInterval(timerInterval);
            
            const timerBar = document.getElementById('timer-bar');
            timerBar.classList.remove('hidden', 'pulse-danger');
            document.documentElement.style.setProperty('--current-timer-color', 'var(--timer-green)');

            // دالة الفحص والتحديث المتكررة
            function checkTime() {
                let now = Date.now();
                let msLeft = quizEndTime - now;
                let secondsLeft = Math.ceil(msLeft / 1000);

                if (secondsLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timer-display').innerText = "00:00";
                    document.getElementById('timer-progress-fill').style.width = "0%";
                    alert("⏰ Time is up! Your quiz will be submitted automatically.");
                    calculateFinalScore(true); 
                    return;
                }

                updateTimerUI(secondsLeft);
            }

            // تشغيل الفحص فوراً ثم ضبط الـ Interval
            checkTime();
            timerInterval = setInterval(checkTime, 1000);
        }

        // 💡 الميزة الأساسية: مراقبة حالة الصفحة عند الخروج والعودة للمتصفح
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && quizEndTime !== null) {
                // عند العودة، نقوم بإعادة مزامنة وحساب الوقت المتبقي فوراً بدون انتظار الثانية القادمة للـ setInterval
                let now = Date.now();
                if (now >= quizEndTime) {
                    clearInterval(timerInterval);
                    calculateFinalScore(true);
                } else {
                    startQuizTimer(); // إعادة تشغيل الـ Loop بالوقت الجديد الفعلي
                }
            }
        });

        function clearQuizStorage() {
            localStorage.removeItem('quiz_end_time');
            localStorage.removeItem('quiz_total_initial_seconds');
            quizEndTime = null;
        }

        function calculateFinalScore(isAutoSubmit = false) {
            const container = document.getElementById('questions-container');
            const cards = container.querySelectorAll('.question-card');
            
            if (!isAutoSubmit) {
                let allAnswered = true;
                let firstUnansweredCard = null;

                cards.forEach(card => {
                    const selectedBtn = card.querySelector('.option-btn.selected');
                    if (!selectedBtn) {
                        allAnswered = false;
                        card.classList.add('missed');
                        if (!firstUnansweredCard) firstUnansweredCard = card;
                    } else {
                        card.classList.remove('missed');
                    }
                });

                if (!allAnswered) {
                    alert("⚠️ Please answer all questions before submitting.");
                    if (firstUnansweredCard) {
                        firstUnansweredCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                    return;
                }
            }

            clearInterval(timerInterval);
            clearQuizStorage(); // تنظيف البيانات عند انتهاء الامتحان
            document.getElementById('timer-bar').classList.add('hidden');

            let score = 0;
            const totalQuestions = cards.length;
            const mistakesContainer = document.getElementById('mistakes-container');
            mistakesContainer.innerHTML = '';
            let mistakesCount = 0;

            cards.forEach(card => {
                const correctAns = card.getAttribute('data-correct');
                const selectedBtn = card.querySelector('.option-btn.selected');
                const selectedLetter = selectedBtn ? selectedBtn.getAttribute('data-opt') : null;
                const questionText = card.querySelector('.q-text').innerHTML;
                
                const badgeEl = card.querySelector('.date-badge');
                let revisionBadgeHTML = badgeEl ? badgeEl.outerHTML : "";

                if (selectedLetter === correctAns) {
                    score++;
                } else {
                    mistakesCount++;
                    
                    const optA = card.getAttribute('data-opta');
                    const optB = card.getAttribute('data-optb');
                    const optC = card.getAttribute('data-optc');
                    const optD = card.getAttribute('data-optd');

                    const letA = card.getAttribute('data-lettera');
                    const letB = card.getAttribute('data-letterb');
                    const letC = card.getAttribute('data-letterc');
                    const letD = card.getAttribute('data-letterd');

                    let classA = (correctAns === 'A') ? 'correct' : (selectedLetter === 'A' ? 'wrong' : '');
                    let classB = (correctAns === 'B') ? 'correct' : (selectedLetter === 'B' ? 'wrong' : '');
                    let classC = (correctAns === 'C') ? 'correct' : (selectedLetter === 'C' ? 'wrong' : '');
                    let classD = (correctAns === 'D') ? 'correct' : (selectedLetter === 'D' ? 'wrong' : '');

                    let iconA = (correctAns === 'A') ? '<span class="feedback-icon">✓</span>' : (selectedLetter === 'A' ? '<span class="feedback-icon">✗</span>' : '');
                    let iconB = (correctAns === 'B') ? '<span class="feedback-icon">✓</span>' : (selectedLetter === 'B' ? '<span class="feedback-icon">✗</span>' : '');
                    let iconC = (correctAns === 'C') ? '<span class="feedback-icon">✓</span>' : (selectedLetter === 'C' ? '<span class="feedback-icon">✗</span>' : '');
                    let iconD = (correctAns === 'A' || correctAns === 'B' || correctAns === 'C' || correctAns === 'D' ? (correctAns === 'D' ? '<span class="feedback-icon">✓</span>' : (selectedLetter === 'D' ? '<span class="feedback-icon">✗</span>' : '')) : '');

                    let mistakeHTML = `
                        <div class="question-card mistake-card">
                            <div class="q-text">${questionText}</div>
                            ${revisionBadgeHTML}
                            <div class="options-grid">
                                <div class="option-btn locked ${classA}"><span class="option-letter">${letA}</span><span class="option-text-content">${optA}</span>${iconA}</div>
                                <div class="option-btn locked ${classB}"><span class="option-letter">${letB}</span><span class="option-text-content">${optB}</span>${iconB}</div>
                                <div class="option-btn locked ${classC}"><span class="option-letter">${letC}</span><span class="option-text-content">${optC}</span>${iconC}</div>
                                <div class="option-btn locked ${classD}"><span class="option-letter">${letD}</span><span class="option-text-content">${optD}</span>${iconD}</div>
                            </div>
                        </div>
                    `;
                    mistakesContainer.innerHTML += mistakeHTML;
                }
            });

            document.getElementById('upload-section').classList.add('hidden');
            container.classList.add('hidden');
            document.getElementById('submit-section').classList.add('hidden');
            
            const resultsPage = document.getElementById('results-page');
            resultsPage.classList.remove('hidden');

            document.getElementById('final-score-display').innerText = `${score} / ${totalQuestions}`;
            const messageEl = document.getElementById('score-message');
            const mistakesTitle = document.getElementById('mistakes-title');

            if (mistakesCount === 0) {
                mistakesTitle.classList.add('hidden');
                messageEl.innerText = "🎉 Outstanding! You got a perfect score! 🎉";
                messageEl.style.color = "var(--neon-correct)";
            } else {
                mistakesTitle.classList.remove('hidden');
                messageEl.innerText = "Good job! Review your mistakes below to learn from them.";
                messageEl.style.color = "var(--text-main)";
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('submit-btn').addEventListener('click', () => calculateFinalScore(false));

        // فحص في حالة عمل ريفريش بالخطأ أو قفل المتصفح وفتحه أثناء تشغيل امتحان سابق
        window.addEventListener('load', () => {
            let savedEndTime = localStorage.getItem('quiz_end_time');
            let savedInitSeconds = localStorage.getItem('quiz_total_initial_seconds');
            
            if (savedEndTime && savedInitSeconds) {
                let now = Date.now();
                if (now < parseInt(savedEndTime)) {
                    // التايمر لم ينتهِ، نقوم باستعادته تلقائياً
                    quizEndTime = parseInt(savedEndTime);
                    totalInitialSeconds = parseInt(savedInitSeconds);
                    // تنبيه: ستحتاج لإعادة تحميل الملف مجدداً إذا قمت بعمل Refresh كامل للمتصفح، 
                    // ولكن الكود سيبقي التايمر حياً وبصحة ممتازة في الخلفية.
                } else {
                    clearQuizStorage();
                }
            }
        });
    </script>
</body>
</html>
