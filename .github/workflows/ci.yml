name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://elbannawy_test:elbannawy_test@localhost:5434/elbannawy_test
  JWT_SECRET: ci-jwt-secret-min-16-chars!!
  COOKIE_SECRET: ci-cookie-secret-min-16-chars!!
  AI_ENCRYPTION_KEY: ci-ai-encryption-key-min-32-chars-long!!
  NODE_ENV: test

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: elbannawy_test
          POSTGRES_PASSWORD: elbannawy_test
          POSTGRES_DB: elbannawy_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready -U elbannawy_test
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @el-bannawy/shared build

      - name: Generate Prisma client
        run: pnpm --filter @el-bannawy/database generate

      - name: Apply database migrations
        run: pnpm --filter @el-bannawy/database migrate:deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: TypeScript check (backend)
        run: pnpm --filter @el-bannawy/backend typecheck

      - name: TypeScript check (web)
        run: pnpm --filter @el-bannawy/web typecheck

      - name: Lint check (backend)
        run: pnpm --filter @el-bannawy/backend lint

      - name: Unit tests (backend)
        run: pnpm --filter @el-bannawy/backend test

      - name: E2E tests (backend)
        run: pnpm --filter @el-bannawy/backend test:e2e

      - name: Build backend
        run: pnpm --filter @el-bannawy/backend build
